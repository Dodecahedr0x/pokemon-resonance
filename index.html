<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>Pokémon Résonance</title>
    <script>
      try {
        if (sessionStorage.getItem('res-launch')) document.documentElement.classList.add('launch-seen');
      } catch (e) {}
    </script>
    <style>
      #root {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      try {
        document.fonts.ready.then(function () {
          document.fonts.forEach(function (f) {
            f.load().catch(function () {});
          });
        });
      } catch (e) {}
    </script>
  </body>
</html>
